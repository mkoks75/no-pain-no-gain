# /etc/nginx/sites-available/sporten.mountainsense.nl
# Kopieer naar /etc/nginx/sites-enabled/ en herlaad nginx
# SSL wordt beheerd door Certbot — run: certbot --nginx -d sporten.mountainsense.nl

server {
    listen 80;
    server_name sporten.mountainsense.nl;

    # Certbot voegt hier automatisch redirect en SSL toe
    location / {
        proxy_pass         http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
